<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Replicon Timesheet</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="auth-shell card">
    <h1>Log in</h1>
    <p class="lede">Use your dashboard account (not your Replicon password).</p>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <div class="actions">
        <button class="btn" type="submit">Log in</button>
      </div>
    </form>
    <p class="muted" style="margin-top:1rem">No account yet? <a href="/register">Register</a></p>
  </div>
</body>
</html>
